# Dev overlay — automatically loaded by `docker compose up`.
#
# - web:  builds the `dev` Dockerfile stage (hot-reload, source mounted)
# - api:  builds the `dev` Dockerfile stage (manage.py runserver, source mounted)
# - DEV_AUTH_BYPASS defaults to True in dev so the api works without
#   needing Authentik fully configured. Production must NEVER set this.

services:
  web:
    build:
      target: dev
    image: primitivehub-web:dev
    command: ["pnpm", "dev"]
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

  api:
    build:
      target: dev
    image: primitivehub-api:dev
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DEBUG: "True"
      DEV_AUTH_BYPASS: "True"
      ALLOWED_HOSTS: "*"
    # Inject dev-only secrets (R2 keys, etc.) from apps/api/.env. The file is
    # gitignored. `required: false` lets the compose start before .env exists.
    env_file:
      - path: ./apps/api/.env
        required: false
    volumes:
      - ./apps/api:/app
      # Anonymous volume: keep container's /opt/venv from being overwritten
      # if the host happens to have one
      - /opt/venv

  # ── Optional MinIO for offline dev (opt-in via `--profile minio`) ─────────
  # Start with: docker compose --profile minio up
  # Then point apps/api/.env at it:
  #   S3_ENDPOINT_URL=http://minio:9000
  #   S3_ACCESS_KEY_ID=minioadmin
  #   S3_SECRET_ACCESS_KEY=minioadmin
  #   S3_BUCKET=primitivehub-primitives-dev
  # The R2 dev path remains the default; MinIO is only for working
  # entirely offline or for stress-testing without burning R2 ops.
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    profiles: [minio]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks: [primitivehub_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  minio_data:
