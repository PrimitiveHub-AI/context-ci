# Dev overlay — automatically loaded by `docker compose up`.
#
# - web:  builds the `dev` Dockerfile stage (hot-reload, source mounted)
# - api:  builds the `dev` Dockerfile stage (manage.py runserver, source mounted)
# - DEV_AUTH_BYPASS defaults to True in dev so the api works without
#   needing Authentik fully configured. Production must NEVER set this.

services:
  web:
    build:
      target: dev
    image: primitivehub-web:dev
    command: ["pnpm", "dev"]
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

  api:
    build:
      target: dev
    image: primitivehub-api:dev
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DEBUG: "True"
      DEV_AUTH_BYPASS: "True"
      ALLOWED_HOSTS: "*"
    # Inject dev-only secrets (R2 keys, etc.) from apps/api/.env. The file is
    # gitignored. `required: false` lets the compose start before .env exists.
    env_file:
      - path: ./apps/api/.env
        required: false
    volumes:
      - ./apps/api:/app
      # Anonymous volume: keep container's /opt/venv from being overwritten
      # if the host happens to have one
      - /opt/venv
