# Dev overlay — automatically loaded by `docker compose up`.
#
# - web:  builds the `dev` Dockerfile stage (hot-reload, source mounted)
# - api:  builds the `dev` Dockerfile stage (manage.py runserver, source mounted)
#
# Authentication: dev runs against the real Authentik service in this
# compose. DEV_AUTH_BYPASS is intentionally NOT set — Step 7 retired the
# bypass so anyone with localhost access can no longer auto-authenticate.
# Sign in via http://localhost:3000/auth/login.

services:
  web:
    build:
      target: dev
    image: primitivehub-web:dev
    command: ["pnpm", "dev"]
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      # Server-side proxy points at the api container by its service name.
      DJANGO_API_BASE_URL: http://api:8000/api/v1
    # OIDC client config lives in apps/web/.env (gitignored). Required:
    #   OIDC_ISSUER_URL, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_REDIRECT_URI
    env_file:
      - path: ./apps/web/.env
        required: false
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
      # docs/ lives at the repo root; the web app's /docs, /decisions,
      # /specs, and search palette read from it via findDocsRoot().
      # The web Dockerfile doesn't bake docs/ into the image (it's
      # owned by the repo, not the web app), so we mount it read-only
      # at a sibling path the discovery walker can find from /app.
      - ./docs:/docs:ro

  api:
    build:
      target: dev
    image: primitivehub-api:dev
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
    # Inject dev-only secrets (R2 keys, etc.) from apps/api/.env. The file is
    # gitignored. `required: false` lets the compose start before .env exists.
    env_file:
      - path: ./apps/api/.env
        required: false
    volumes:
      - ./apps/api:/app
      # Anonymous volume: keep container's /opt/venv from being overwritten
      # if the host happens to have one
      - /opt/venv
      # Trust Contract conformance fixtures live at the repo root —
      # the api test harness validates against them. Read-only because
      # the fixtures are version-controlled artifacts edited from the
      # host, not the container.
      - ./docs:/repo/docs:ro

  api-worker:
    build:
      target: dev
    image: primitivehub-api:dev
    # In dev, restart on source changes by using --connection-timeout=0
    # so Procrastinate exits cleanly on SIGTERM and compose can re-spawn it
    # when we `docker compose restart api-worker`. We don't have file-watch
    # auto-reload yet (Phase 4 follow-up if it becomes painful).
    command:
      - "sh"
      - "-c"
      - |
        python manage.py migrate procrastinate --noinput && \
        exec python manage.py procrastinate worker --queues=default
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
    env_file:
      - path: ./apps/api/.env
        required: false
    volumes:
      - ./apps/api:/app
      - /opt/venv

  # ── Optional MinIO for offline dev (opt-in via `--profile minio`) ─────────
  # Start with: docker compose --profile minio up
  # Then point apps/api/.env at it:
  #   S3_ENDPOINT_URL=http://minio:9000
  #   S3_ACCESS_KEY_ID=minioadmin
  #   S3_SECRET_ACCESS_KEY=minioadmin
  #   S3_BUCKET=primitivehub-primitives-dev
  # The R2 dev path remains the default; MinIO is only for working
  # entirely offline or for stress-testing without burning R2 ops.
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    profiles: [minio]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks: [primitivehub_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  minio_data:
