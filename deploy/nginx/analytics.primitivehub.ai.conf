# analytics.primitivehub.ai → Umami (ADR-0046)
#
# Host nginx vhost. Fronted by Cloudflare proxied DNS (orange cloud):
#   A  analytics  →  178.105.164.250   (Proxied)
#
# HTTP-only on purpose: `certbot --nginx` adds the `listen 443 ssl` + cert
# lines + the 80→443 redirect itself. (Shipping a 443 block up front fails
# `nginx -t` because the cert doesn't exist yet.)
#
# Install:
#   sudo cp deploy/nginx/analytics.primitivehub.ai.conf /etc/nginx/sites-available/analytics.primitivehub.ai
#   sudo ln -s /etc/nginx/sites-available/analytics.primitivehub.ai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d analytics.primitivehub.ai      # provisions + wires TLS
#
# ACME gotcha behind Cloudflare: issue the cert with the A record set to
# "DNS only" (grey cloud), THEN switch it to "Proxied" (orange). Otherwise
# Cloudflare intercepts the http-01 challenge. After issuance, set the CF
# SSL/TLS mode to "Full (strict)".

server {
    listen 80;
    listen [::]:80;
    server_name analytics.primitivehub.ai;

    # Umami sends a tracker script + small JSON ingest; a few KB is plenty.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Real visitor IP from Cloudflare (so Umami logs visitors, not CF edges).
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
    }
}
