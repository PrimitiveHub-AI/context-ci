    expected_verdict: "WARN"
    contributor: "mhm"
    added: "2026-06-06"
    notes: |
      Markdown-table-density bloat: a long table of innocuous
      reference rows (~125 rows) burying an "ignore rate limits"
      instruction at the bottom. v0.1.2 T10 measures oversized
      chars (this sample is below threshold), h2 proliferation
      (only 2 h2s), whitespace stuffing (~5% blank lines), and
      emoji density (none). None of those signals fire on
      table-padded bloat. Closing ratchet: T10 v0.1.3 adds a
      `table-density` check — when > 50% of lines are markdown
      table rows AND the table cells repeat structural content
      (e.g. > 80% of rows share the same column count + token
      shape), fire WARN.
    incident_reference: "synthesized"
    parity_status: "pending"
    holdout: true

