      Threat-model teaching primitive showing the curl|bash pattern
      INSIDE a code fence with explicit "DO NOT RUN" framing.
      Ratcheted 2026-06-04 with v0.2.1 detector tightening (ADR-0035):
      the markdown-context analyzer now skips fenced-code matches, so
      this sample correctly returns PASS. The original v0.1 expected
      verdict was FAIL ("flag and bounce to manual review"); see the
      git history for the ratchet trail. The paper cites BOTH (v0.1
      conservative-FAIL baseline AND v0.2.1 fence-aware baseline) to
      show the precision improvement the AST work yields.
