      `brew install` / `brew install --cask` family to T5's
      pattern set + flag the `sudo spctl --master-disable`
      Gatekeeper bypass as a sibling install-instruction shape.
    incident_reference: "synthesized"
    parity_status: "pending"
    holdout: true

