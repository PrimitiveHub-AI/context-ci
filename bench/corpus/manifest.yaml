# PrimitiveHub Adversarial Corpus v0.1
#
# Source of truth for sample labels. Every file under bench/corpus/samples/
# MUST have an entry here; every entry MUST point to an existing file.
# See docs/corpus-v0.1.md for the full schema and contribution rules.
# See docs/decisions/0032-adversarial-corpus-and-detector-precision-recall.md
# for the methodology + governance ADR.
#
# DISCIPLINE:
#   - IDs are zero-padded, monotonic, NEVER re-used.
#   - Adversarial samples MUST cite a real provenance URL or use
#     "synthesized" in `incident_reference`.
#   - `parity_status` is computed by the measurement harness, not edited
#     by hand.
#   - The corpus is append-only. Removal requires an ADR-level
#     justification.

