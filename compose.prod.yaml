# Production overlay — only loaded explicitly:
#
#   docker compose -f compose.yaml -f compose.prod.yaml pull
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# In prod we never build locally — the image comes from GHCR (built by CI).

services:
  web:
    pull_policy: always
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The web API only enqueues + reads cache now (ADR-0044) — cheap and
  # bounded, so a modest cap is plenty.
  api:
    pull_policy: always
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The worker runs the scans. `--concurrency` bounds parallel scans;
  # mem_limit is the hard backstop so a couple of large github extractions
  # (256 MiB uncompressed each) can't OOM the host. Raise both together.
  api-worker:
    pull_policy: always
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
