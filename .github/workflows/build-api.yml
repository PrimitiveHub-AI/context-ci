name: api — lint + test + build + publish

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/build-api.yml"
      - "compose.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/build-api.yml"
      - "compose.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/primitivehub-api
  PYTHON_VERSION: "3.13"

jobs:
  preflight:
    name: lint + types + tests
    runs-on: ubuntu-latest
    # pytest uses settings_test (Postgres backend + RLS). Provide a DB whose
    # superuser matches the app role so the RLS migrations can CREATE the
    # `test_bypass_rls` role (NOLOGIN, BYPASSRLS) that conftest SET ROLEs to.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: primitivehub_app
          POSTGRES_PASSWORD: primitivehub_app
          POSTGRES_DB: primitivehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.4"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies (including dev)
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy primitivehub_api accounts orgs registry storage validation signing jobs

      - name: Schema invariant checks
        run: uv run python scripts/check_schema.py

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: primitivehub_api.settings_test
        run: uv run python manage.py check --fail-level WARNING

      - name: pytest
        env:
          DJANGO_SETTINGS_MODULE: primitivehub_api.settings_test
          # Services are reachable on localhost from a non-container job.
          TEST_DATABASE_URL: postgres://primitivehub_app:primitivehub_app@localhost:5432/primitivehub_test
        run: uv run pytest

  build:
    name: build api image
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          target: runner
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
