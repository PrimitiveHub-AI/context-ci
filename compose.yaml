# PrimitiveHub Compose stack — base config.
#
#   docker compose up                                           → dev (loads compose.yaml + compose.override.yaml)
#   docker compose -f compose.yaml -f compose.prod.yaml up -d   → production
#
# Services:
#   web                  — Next.js 16 frontend (apps/web)
#   api                  — Django + Ninja backend (apps/api)
#   postgres             — Postgres 17 (truth DB; shared with authentik via separate DB names)
#   valkey               — Valkey 8 (cache + sessions + rate limiting)
#   authentik-server     — Authentik OIDC identity provider
#   authentik-worker     — Authentik background worker
#
# Object storage (Cloudflare R2 in v1) is external — not a container.

name: primitivehub

services:
  # ── Frontend ──────────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
      args:
        # Baked into the SSG'd HTML at build time (ADR-0046). Empty → no
        # analytics beacon. Set both to enable first-party Umami tracking.
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    image: ${WEB_IMAGE:-ghcr.io/devxyzx/primitivehub-web:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    networks: [primitivehub_net]

  # ── Backend ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runner
    image: ${API_IMAGE:-ghcr.io/devxyzx/primitivehub-api:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-not-for-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DATABASE_URL: postgres://primitivehub:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/primitivehub
      VALKEY_URL: redis://valkey:6379/0
      OIDC_ISSUER: ${OIDC_ISSUER:-http://authentik-server:9000/application/o/primitivehub/}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-primitivehub-api}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-False}
      # S3 / R2 credentials come from env_file (dev: apps/api/.env; prod:
      # host shell or compose secrets). Don't default them here — an empty
      # default would override env_file due to compose precedence rules.
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/healthz | grep -q '\"status\": *\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [primitivehub_net]

  # ── Background worker (Procrastinate, ADR-0004) ───────────────────────────
  # Long-polls Postgres for queued tasks. Same image + same env as `api` —
  # only the entrypoint differs. Runs migrations on startup so a fresh
  # cluster comes up green without manual steps.
  api-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runner
    image: ${API_IMAGE:-ghcr.io/devxyzx/primitivehub-api:latest}
    restart: unless-stopped
    command:
      - "sh"
      - "-c"
      - |
        python manage.py migrate procrastinate --noinput && \
        exec python manage.py procrastinate worker \
          --queues=default,checks \
          --concurrency=${CHECK_WORKER_CONCURRENCY:-2}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-not-for-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DATABASE_URL: postgres://primitivehub:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/primitivehub
      VALKEY_URL: redis://valkey:6379/0
      OIDC_ISSUER: ${OIDC_ISSUER:-http://authentik-server:9000/application/o/primitivehub/}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-primitivehub-api}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-False}
      # S3 / R2 credentials inherited via env_file in compose.override.yaml
      # (workers will need R2 read for signing Phase 4 PR #3).
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Returns exit 0 if Postgres + procrastinate schema are reachable.
      test: ["CMD", "python", "manage.py", "procrastinate", "healthchecks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [primitivehub_net]

  # ── Truth DB ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: primitivehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      # Two databases in one Postgres instance: primitivehub (api) + authentik (idp).
      # The init script creates the second one.
      POSTGRES_DB: primitivehub
      # Three databases in one instance: primitivehub (api) + authentik (idp)
      # + umami (analytics, ADR-0046). The init script creates the extras —
      # but only on a FRESH cluster. For an existing cluster, create the
      # umami DB once by hand (SQL in ADR-0046 § Migration).
      POSTGRES_MULTIPLE_DATABASES: authentik,umami
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primitivehub -d primitivehub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [primitivehub_net]

  # ── Cache / sessions / rate limit ─────────────────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # maxmemory + LRU eviction so the check input/result/dedup keys (and
    # sessions + rate-limit counters) can't grow unbounded and OOM the host
    # under launch load. All check keys carry TTLs; allkeys-lru is a safe
    # backstop. Size via VALKEY_MAXMEMORY to the host's budget.
    command:
      - "valkey-server"
      - "--save"
      - "60"
      - "1"
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "${VALKEY_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [primitivehub_net]

  # ── OIDC identity provider ────────────────────────────────────────────────
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: valkey
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: primitivehub
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-replace-me-in-production-32-chars-min}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-changeme-on-first-login}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@cyberorca.sa}
    ports:
      - "127.0.0.1:${AUTHENTIK_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    networks: [primitivehub_net]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: valkey
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: primitivehub
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-replace-me-in-production-32-chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    networks: [primitivehub_net]

  # ── Self-hosted analytics (ADR-0046) ──────────────────────────────────────
  # First-party, privacy-first page analytics. Replaces the @vercel/analytics
  # beacon (a no-op off-Vercel + a third-party call). Profile-gated like minio
  # so a plain `docker compose up` dev loop stays lean on the 8GB host; enable
  # it with `--profile analytics` (dev) or COMPOSE_PROFILES=analytics (prod).
  # Localhost-bound (Hard rule #3). Stores in its own `umami` DB on the shared
  # Postgres 17 instance; Umami runs its own schema migrations on boot.
  umami:
    image: ghcr.io/umami-software/umami:3.2.0
    profiles: [analytics]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://primitivehub:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-dev-umami-secret-change-in-production}
      # We don't phone home (on-brand: we are the Context Firewall).
      DISABLE_TELEMETRY: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [primitivehub_net]

  # Public exposure for analytics.primitivehub.ai is handled by the HOST nginx
  # (a vhost that proxies to 127.0.0.1:${UMAMI_PORT:-3001}) fronted by Cloudflare
  # proxied DNS → 178.105.164.250. Config: deploy/nginx/analytics.primitivehub.ai.conf.
  # Umami itself stays localhost-only; no container faces the public interface.

volumes:
  postgres_data:
  valkey_data:

networks:
  primitivehub_net:
    driver: bridge
