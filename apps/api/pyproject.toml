[project]
name = "primitivehub-api"
version = "0.1.0"
description = "PrimitiveHub registry backend — Django + Django Ninja + Postgres + Procrastinate + R2 + Authentik OIDC"
requires-python = ">=3.13"
license = "Proprietary"
authors = [
    { name = "CyberOrca Labs" },
]

dependencies = [
    # Core
    "django>=5.1,<6.0",
    "django-ninja>=1.3.0",
    "pydantic>=2.9",
    # Database
    "psycopg[binary,pool]>=3.2",
    "dj-database-url>=2.3",
    # Cache + sessions
    "redis>=5.2",                # wire-compatible with Valkey
    "django-redis>=5.4",
    # OIDC / auth
    "pyjwt[crypto]>=2.10",
    "cryptography>=44.0",
    "httpx>=0.27",               # for OIDC discovery + JWKS fetch
    # Object storage
    "boto3>=1.35",               # S3-compatible client (R2 in prod, MinIO option for self-host)
    "boto3-stubs[s3]>=1.35",
    # Background jobs (Phase 4 wires these; declared now for lockfile stability)
    "procrastinate[django]>=2.15",
    # Settings
    "django-environ>=0.11",
    # Observability deferred — print-to-stdout + JSON-line logging via structlog for now
    "structlog>=24.4",
    # Cryptographic operations
    "in-toto-attestation>=0.9",   # canonical statement helpers
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "django-stubs-ext>=5.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # ruff-specific
    "DJ",     # flake8-django
    "S",      # flake8-bandit (security)
    "PTH",    # flake8-use-pathlib
    "SIM",    # flake8-simplify
    "PT",     # flake8-pytest-style
    "TCH",    # flake8-type-checking
]
ignore = [
    "E501",   # line length is handled by formatter
    "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012", "DJ"]
"**/tests/**" = ["S", "PT004"]
"**/conftest.py" = ["S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "primitivehub_api.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "primitivehub_api.settings_test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=apps",
    "--cov=primitivehub_api",
    "--cov-report=term-missing:skip-covered",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["apps", "primitivehub_api"]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
