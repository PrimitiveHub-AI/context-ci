[project]
name = "primitivehub-api"
version = "0.1.0"
description = "PrimitiveHub registry backend — Django + Django Ninja + Postgres + Procrastinate + R2 + Authentik OIDC"
requires-python = ">=3.13"
license = "Proprietary"
authors = [
    { name = "CyberOrca Labs" },
]

dependencies = [
    # Core
    "django>=5.1,<6.0",
    "django-ninja>=1.3.0",
    "pydantic>=2.9",
    # ASGI server (prod runtime) — the runner image CMD runs
    # `python -m uvicorn primitivehub_api.asgi:application`. MUST be a
    # production dep (deps stage installs with --no-dev); its absence is why
    # the prod api image crash-looped with "No module named uvicorn".
    "uvicorn[standard]>=0.30",
    # Database
    "psycopg[binary,pool]>=3.2",
    "dj-database-url>=2.3",
    # Cache + sessions
    "redis>=5.2", # wire-compatible with Valkey
    "django-redis>=5.4",
    # OIDC / auth
    "pyjwt[crypto]>=2.10",
    "cryptography>=44.0",
    "httpx>=0.27", # for OIDC discovery + JWKS fetch
    # Object storage
    "boto3>=1.35", # S3-compatible client (R2 in prod, MinIO option for self-host)
    "boto3-stubs[s3]>=1.35",
    # Background jobs (Phase 4 wires these; declared now for lockfile stability)
    "procrastinate[django]>=2.15",
    # Settings
    "django-environ>=0.11",
    # CORS — the web app at localhost:3000 calls the api at localhost:8000.
    # In prod the two share an origin (reverse-proxied), but dev needs CORS.
    "django-cors-headers>=4.5",
    # Observability deferred — print-to-stdout + JSON-line logging via structlog for now
    "structlog>=24.4",
    # Cryptographic operations
    "in-toto-attestation>=0.9",
    "sigstore>=3.0,<5",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "django-stubs-ext>=5.1",
    "moto[s3]>=5.0",            # in-process S3 mock for storage tests
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # ruff-specific
    "DJ",     # flake8-django
    "S",      # flake8-bandit (security)
    "PTH",    # flake8-use-pathlib
    "SIM",    # flake8-simplify
    "PT",     # flake8-pytest-style
    "TCH",    # flake8-type-checking
]
ignore = [
    "E501",   # line length is handled by formatter
    "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012", "DJ"]
"**/tests/**" = ["S", "PT004"]
"**/conftest.py" = ["S"]
# Django Model.Meta uses class-level lists/dicts (indexes, constraints,
# REQUIRED_FIELDS, verbose_name_plural) by design — Django reads them at
# metaclass time. RUF012's ClassVar recommendation doesn't apply.
"**/models.py" = ["RUF012"]
# T2 detector tests intentionally contain confusable Cyrillic/Greek
# codepoints — that's the attack payload being tested. RUF001/002/003
# is the same defense family; allow these rules on this file only.
"**/tests/test_scanners_t2.py" = ["RUF001", "RUF002", "RUF003"]
# Detector sources legitimately contain confusable Cyrillic/Greek/ASCII
# codepoints in lookup tables + fixtures (t2 steganography, t7 poisoned-naming,
# t5/t10 message strings) — that IS the attack surface they detect. The
# ambiguous-unicode family (RUF001/002/003) is noise here; allow it across scanners.
"**/scanners/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

# Phase 3 bootstrap debt — these files need typing cleanup as a follow-up.
# Listed explicitly so the gap stays visible (not hidden under a wildcard).
[[tool.mypy.overrides]]
module = "environ"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "accounts.middleware"
ignore_errors = true

[[tool.mypy.overrides]]
module = "accounts.tenant_middleware"
ignore_errors = true

[[tool.mypy.overrides]]
module = "accounts.admin"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "primitivehub_api.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "primitivehub_api.settings_test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Force settings_test.py even when the container's DJANGO_SETTINGS_MODULE
    # env var points at production settings. --ds beats env per pytest-django.
    "--ds=primitivehub_api.settings_test",
    # Reuse the test DB across sessions. Required because the test
    # database carries role grants (test_bypass_rls) applied by the
    # postgres init flow; pytest-django's default --create-db drops the
    # DB and loses the grants. The CI workflow pre-creates the DB
    # with these grants once and uses --reuse-db on every run.
    "--reuse-db",
    "--cov=apps",
    "--cov=primitivehub_api",
    "--cov-report=term-missing:skip-covered",
    # Skip @pytest.mark.integration by default — those tests hit real
    # external services (sigstage Fulcio + Rekor) and need network +
    # an operator-provided OIDC token. Opt in with `pytest -m integration`.
    "-m", "not integration",
]
asyncio_mode = "auto"
markers = [
    "integration: hits real external services (sigstage Fulcio + Rekor). Slow, needs network, gated by SIGSTAGE_OIDC_TOKEN env. Run with `pytest -m integration`.",
]

[tool.coverage.run]
source = ["apps", "primitivehub_api"]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
