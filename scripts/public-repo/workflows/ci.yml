# Context CI — workspace CI (typecheck + build + test + dry-run publish).
# One job for the whole pnpm workspace; `pnpm -r` runs in topological order
# (verify → phub → mcp-server), so no manual "build verify first" dance.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "actions/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "actions/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: typecheck + build + test + dry-run publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # Build first: phub/mcp-server typecheck against verify's emitted
      # dist/*.d.ts, so the build must precede the typecheck.
      - name: Build (topological)
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Validates every package's packaging + that workspace:^ deps rewrite
      # to real versions. No registry write.
      - name: pnpm publish --dry-run (all packages)
        run: pnpm -r publish --dry-run --no-git-checks
